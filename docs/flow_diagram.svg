        <text x="25" y="85" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#0F5C84">Ultrasonik (HC‑SR04)</text>
        <text x="25" y="105" font-family="'Segoe UI',sans-serif" font-size="11" fill="#666">Ketinggian air (cm)</text>
        <text x="25" y="125" font-family="'Segoe UI',sans-serif" font-size="10" fill="#999">Ambang batas 20 cm</text>
        <rect x="15" y="160" width="190" height="80" rx="6" fill="#F5F5F5" stroke="#0F5C84" stroke-width="1.5"/>
        <text x="25" y="185" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#0F5C84">Raindrop (YL‑83 Analog)</text>
        <text x="25" y="205" font-family="'Segoe UI',sans-serif" font-size="11" fill="#666">Status cuaca (analog)</text>
        <text x="25" y="225" font-family="'Segoe UI',sans-serif" font-size="10" fill="#999">Cerah / Sedang / Lebat</text>
        <rect x="15" y="260" width="190" height="80" rx="6" fill="#F5F5F5" stroke="#0F5C84" stroke-width="1.5"/>
        <text x="25" y="285" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#0F5C84">Infrared (FC‑51)</text>
        <text x="25" y="305" font-family="'Segue UI',sans-serif" font-size="11" fill="#666">Deteksi sampah (HIGH/LOW)</text>
