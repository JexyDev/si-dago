    <path d="M630 500 L730 500" fill="none" stroke="#0288D1" stroke-width="3"/>
    <polygon points="735,500 725,495 725,505" fill="#0288D1"/>
    <rect x="640" y="508" width="80" height="30" rx="3" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1"/>
    <text x="680" y="526" font-family="'Segue UI',sans-serif" font-size="9" font-weight="bold" fill="#0288D1" text-anchor="middle">HTTPS POST</text>
    <g transform="translate(740,110)" filter="url(#shadow)">
        <rect width="220" height="230" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>
        <rect width="220" height="40" rx="8" fill="url(#greenGrad)"/>
        <text x="110" y="25" font-family="'Segue UI',sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🖥️ CLIENT: DASHBOARD</text>
