        <text x="120" y="390" font-family="'Segue UI',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Broadcaster Engine</text>
        <text x="120" y="410" font-family="'Segue UI',sans-serif" font-size="10" fill="#FFE082" text-anchor="middle">Socket.IO Dispatcher</text>
        <text x="120" y="425" font-family="'Segue UI',sans-serif" font-size="10" fill="#FFE082" text-anchor="middle">HTTPS POST to Telegram Bot API</text>
    </g>
    <path d="M630 480 L690 480 L690 280 L730 280" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="5,3"/>
    <polygon points="735,280 725,275 725,285" fill="#2E7D32"/>
    <rect x="635" y="295" width="90" height="30" rx="3" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
