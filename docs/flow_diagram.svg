        <text x="25" y="75" font-family="'Segue UI',sans-serif" font-size="11" font-weight="bold" fill="#33691E">main.js (Socket.IO Client)</text>
        <text x="25" y="95" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Listener socket.on('sensor_update')</text>
        <text x="25" y="115" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Auto‑update UI tanpa reload</text>
        <text x="25" y="135" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Chart.js real‑time grafik</text>
        <text x="25" y="155" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Log max 15 baris</text>
        <text x="110" y="200" font-family="'Segue UI',sans-serif" font-size="12" font-weight="bold" fill="#1B5E20" text-anchor="middle">Live < 200 ms</text>
    </g>
    <g transform="translate(740,360)" filter="url(#shadow)">
        <rect width="220" height="210" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>
        <rect width="220" height="40" rx="8" fill="url(#blueGrad)"/>
        <text x="110" y="25" font-family="'Segue UI',sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">📲 CLIENT: TELEGRAM WARGA</text>
        <rect x="15" y="55" width="190" height="140" rx="6" fill="#E1F5FE" stroke="#0288D1" stroke-width="1"/>
        <text x="25" y="75" font-family="'Segue UI',sans-serif" font-size="11" font-weight="bold" fill="#01579B">Telegram Bot API Engine</text>
        <text x="25" y="95" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Otomatis kirim pesan darurat</text>
        <text x="25" y="115" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Broadcast multi‑chat</text>
        <text x="25" y="135" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• Markdown format</text>
        <text x="25" y="155" font-family="'Segue UI',sans-serif" font-size="10" fill="#444">• /start registrasi</text>
