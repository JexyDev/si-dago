        <text x="25" y="285" font-family="'Segue UI',sans-serif" font-size="11" font-weight="bold" fill="#C62828">Anti‑Spam & Persistensi</text>
        <text x="25" y="305" font-family="'Segue UI',sans-serif" font-size="10" fill="#333">• 15‑sample persistensi (30 s)</text>
        <text x="25" y="320" font-family="'Segue UI',sans-serif" font-size="10" fill="#333">• Cool‑down notifikasi (15‑30 s)</text>
        <text x="25" y="335" font-family="'Segue UI',sans-serif" font-size="10" fill="#333">• Evaluasi Bahaya Sejati (3 sensor)</text>
