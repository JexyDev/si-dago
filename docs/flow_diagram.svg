        <text x="25" y="185" font-family="'Segue UI',sans-serif" font-size="10" fill="#555">• Air (max 70 %)</text>
        <text x="25" y="200" font-family="'Segue UI',sans-serif" font-size="10" fill="#555">• Sampah (+20 %)</text>
        <text x="25" y="215" font-family="'Segue UI',sans-serif" font-size="10" fill="#555">• Hujan (+10 %)</text>
