            <stop offset="0%" stop-color="#0F5C84" />
            <stop offset="100%" stop-color="#06344B" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2E7D32" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF6C00" />
            <stop offset="100%" stop-color="#E65100" />
        </linearGradient>
        <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#37474F" />
            <stop offset="100%" stop-color="#212121" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
        </filter>
    </defs>
    <rect width="1000" height="650" fill="#F4F6F8" rx="10"/>
    <text x="500" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0A4F6E" text-anchor="middle">DIAGRAM ALUR DATA REAL‑TIME (DATA PIPELINE) SI DAGO</text>
    <text x="500" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#555" text-anchor="middle">Bogor Innovation Awards 2026 • Sistem Cerdas Peringatan Dini Banjir Drainase Kota berbasis IoT</text>
    <g transform="translate(40,110)" filter="url(#shadow)">
